<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SVG Example</title>
</head>
<body>
    <h1>Introduction to SVG</h1>

    <h2>1. Draw a Circle</h2>

    <svg width="200" height="150">
        <circle cx="100" cy="75" r="50" fill="blue"/>
    </svg>

    <h2> 2.Draw a Rectangle </h2>

    <svg width="200" height="150">
        <rect width="150" height="80" x="25" y="30" fill="red"/>
    </svg>

    <h2>3. Draw a Line</h2>

    <svg width="200" height="100">
        <line x1="20" y1="10" x2="180" y2="80" stroke="red" stroke-width/>
    </svg>

    <h2> 4.Draw a Ellipse</h2>

    <svg width="200" height="100">
        <ellipse cx="100" cy="75" rx="80" ry="40" fill="orange"/>
    </svg>

    <h2> 5.Draw a Square</h2>

    <svg width="200" height="200">
    <rect width="200" height="200" x="40" y="40" fill="gold">
    </svg>

    <h2> 6.Draw a Star</h2>
    <svg width="500" height="250">
        <polygon points="100,10,40,198,190,78,10,78,160,198"
                 fill="pink" stroke-width/>
    </svg>
    
</body>
</html>
