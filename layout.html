<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Layout Practice</title>
    <link rel="stylesheet" href="style2.css">
</head>
<body>

    <h1>CSS Layout Practice</h1>

    <!-- Flexbox -->
    <section>
        <h2>1. Flexbox</h2>
        <div class="flex-container">
            <div>HTML</div>
            <div>CSS</div>
            <div>JavaScript</div>
        </div>
    </section>

     <!-- CSS Grid -->
    <section>
        <h2>2. CSS Grid</h2>
        <div class="grid-container">
            <div>HTML</div>
            <div>CSS</div>
            <div>JavaScript</div>
            <div>Python</div>
            <div>SQL</div>
            <div>MongoDB</div>
        </div>
    </section>
    
    <!-- Responsive Design -->
    <secton>
        <h2>3. Responsive Design </h2>
        <div class="responsive-container">
            <div>Card 1</div>
            <div>Card 2</div>
            <div>Card 3</div>
        </div>
    </secton>
    
</body>
</html>
